# ============================================================
# coturn TURN server for RemoteDesk
# 部署在公网 VPS 上，用于 WebRTC P2P 打不通时的中继
# 修改后用: docker compose up -d
# ============================================================

# --- 监听端口 ---
listening-port=3478
tls-listening-port=5349

# --- 认证 ---
# 方式一（M0 先用这个）: 静态用户名密码，客户端直接用
lt-cred-mech
realm=remotedesk
user=remotedesk:CHANGE_ME_STRONG_PASSWORD

# 方式二（进阶, M2+）: TURN REST API, 由信令服务器签发临时凭证
# 启用时注释掉上面的 user= 行，改开下面两行：
# use-auth-secret
# static-auth-secret=CHANGE_ME_SHARED_SECRET

# --- 中继端口范围 ---
min-port=49152
max-port=65535

# --- 安全 ---
fingerprint
no-multicast-peers
# 禁止 loopback / 私网地址作为 peer（按需开启）
# denied-peer-ip=0.0.0.0-0.255.255.255
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=127.0.0.0-127.255.255.255
# denied-peer-ip=169.254.0.0-169.254.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255

# --- 公网 IP（关键）---
# 若 VPS 的网卡直接持有公网 IP，可留空；
# 若在 1:1 NAT / 云厂商 NAT 后面，必须填公网IP：
# external-ip=YOUR_PUBLIC_IP
# 若 NAT 内外 IP 不同: external-ip=PUBLIC_IP/PRIVATE_IP

# --- 日志 ---
log-file=stdout
simple-log
no-cli
